tasks:
  be_run:
    cmd: uv run fastapi dev -e kbsb.main:app --reload
    help: run the backend fastapi server
  check_before:
    cmd: uv run python scripts/deploy_check.py before
    help: secrets and tests, before a deploy (read-only)
  check_after:
    cmd: uv run python scripts/deploy_check.py after
    help: the live site after a deploy (read-only)
  deploy:
    sequence:
      - ref: check_before
      - cmd: yarn generate
        cwd: frontend
        env:
          API_URL: https://www.frbe-kbsb-ksb.be/
      - cmd: gcloud app deploy
      - ref: check_after
    help: deploy app on google cloud (stops before the upload if a check fails)
  fe_build:
    shell: |
      pushd frontend
      yarn
      popd
    help: update frontend installation
  fe_run:
    shell: |
      pushd frontend
      yarn dev
      popd
    help: run yarn dev in frontend
  gcp_init:
    shell: |
      gcloud config configurations activate kbsbprod
      gcloud auth application-default login
    help: activate the gcloud kbsbprod configuration
  i18n:
    cmd:  uv run python -m kbsb.etl.i18n
    help: regenerate i18n files
  requirements:
    cmd: uv export --no-hashes --format requirements-txt -o requirements.txt
    help: create requirements.txt in src directory
shell_interpreter: bash